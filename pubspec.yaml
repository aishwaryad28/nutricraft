name: nutricraft
description: Your Personalized Food Journey
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  flutter_riverpod: ^2.4.9
  shared_preferences: ^2.2.2
  intl: ^0.19.0
  fl_chart: ^0.66.0
  google_fonts: ^6.1.0
  lottie: ^2.7.0
  smooth_page_indicator: ^1.1.0
 
  timezone: ^0.9.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1

flutter:
  uses-material-design: true
  assets:
    - assets/images/app_icon.png
    - assets/images/avocado_toast.jpg
    - assets/images/yogurt_parfait.jpg
    - assets/images/quinoa_salad.jpg
    - assets/images/grilled_chicken.jpg
    - assets/images/smoothie_bowl.jpg
    - assets/images/lentil_soup.jpg
